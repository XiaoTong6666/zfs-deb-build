name: Cleanup old nightly DEB packages

on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:
  push:
    branches:
      - gh-pages
    paths:
      - '.github/workflows/cleanup-old-debs.yml'

permissions:
  contents: write

concurrency:
  group: cleanup-old-nightly-debs
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch gh-pages metadata with a partial clone
        id: checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir repo
          cd repo
          git init
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config core.sparseCheckout true
          git config core.sparseCheckoutCone false
          git config remote.origin.promisor true
          git config remote.origin.partialclonefilter blob:none
          cat > .git/info/sparse-checkout <<'EOF'
          /.github/
          /dists/nightly/Release
          /dists/nightly/InRelease
          /dists/nightly/Release.gpg
          /dists/nightly/main/binary-amd64/Packages
          /dists/nightly/main/binary-amd64/Packages.gz
          EOF
          git -c protocol.version=2 fetch --filter=blob:none --no-tags origin gh-pages
          git checkout -B gh-pages FETCH_HEAD
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Remove DEB packages older than 180 days
        id: prune
        working-directory: repo
        env:
          RETENTION_DAYS: '180'
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          package_dir = "dists/nightly/main/binary-amd64"
          cutoff = int((datetime.now(timezone.utc) - timedelta(days=int(os.environ["RETENTION_DAYS"]))).timestamp())

          history = subprocess.check_output(
              ["git", "log", "--format=@@%ct", "--name-only", "--no-renames", "--", package_dir],
              text=True,
          )
          last_changed = {}
          commit_time = None
          for line in history.splitlines():
              if line.startswith("@@"):
                  commit_time = int(line[2:])
              elif line.startswith(package_dir + "/") and line.endswith(".deb"):
                  if commit_time is not None:
                      last_changed.setdefault(line, commit_time)

          current = subprocess.check_output(
              ["git", "ls-tree", "-r", "--name-only", "HEAD", "--", package_dir],
              text=True,
          ).splitlines()
          debs = [path for path in current if path.endswith(".deb")]

          missing_dates = [path for path in debs if path not in last_changed]
          if missing_dates:
              raise SystemExit(
                  "Refusing to delete anything: could not determine the last-change date "
                  f"for {len(missing_dates)} current package(s); first: {missing_dates[0]}"
              )

          old = [path for path in debs if last_changed[path] < cutoff]
          output_path = os.environ["GITHUB_OUTPUT"]
          with open(output_path, "a", encoding="utf-8") as output:
              output.write(f"deleted_count={len(old)}\n")

          if not old:
              print("No nightly DEB packages are older than 180 days.")
              raise SystemExit(0)

          packages_path = Path(package_dir) / "Packages"
          packages_text = packages_path.read_text(encoding="utf-8")
          old_set = set(old)
          stanzas = [part for part in re.split(r"\n\s*\n", packages_text.strip()) if part.strip()]
          kept = []
          removed_stanzas = 0
          for stanza in stanzas:
              match = re.search(r"(?m)^Filename:\s*(\S+)", stanza)
              filename = match.group(1) if match else None
              if filename in old_set:
                  removed_stanzas += 1
              else:
                  kept.append(stanza)

          packages_path.write_text(
              ("\n\n".join(kept) + "\n") if kept else "",
              encoding="utf-8",
          )

          old_files_path = Path(os.environ["RUNNER_TEMP"]) / "old-nightly-debs.json"
          old_files_path.write_text(__import__("json").dumps(old), encoding="utf-8")
          print(f"Removed {len(old)} old .deb files ({len(old) - removed_stanzas} had no Packages stanza).")
          print(f"Removed {removed_stanzas} package-index stanza(s).")
          PY

      - name: Install APT repository tools
        if: steps.prune.outputs.deleted_count != '0'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils gnupg

      - name: Regenerate APT indexes
        if: steps.prune.outputs.deleted_count != '0'
        working-directory: repo
        run: |
          set -euo pipefail
          gzip -n -9 -c dists/nightly/main/binary-amd64/Packages > dists/nightly/main/binary-amd64/Packages.gz
          cd dists/nightly
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="XiaoTong6666 ZFS" \
            -o APT::FTPArchive::Release::Label="XiaoTong6666 ZFS Repo" \
            -o APT::FTPArchive::Release::Suite="nightly" \
            -o APT::FTPArchive::Release::Codename="nightly" \
            -o APT::FTPArchive::Release::Architectures="amd64" \
            -o APT::FTPArchive::Release::Components="main" \
            release . > Release

      - name: Import APT signing key
        if: steps.prune.outputs.deleted_count != '0'
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Sign APT repository metadata
        if: steps.prune.outputs.deleted_count != '0'
        working-directory: repo
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
        run: |
          set -euo pipefail
          gpg --clearsign --yes -u "$GPG_FINGERPRINT" -o dists/nightly/InRelease dists/nightly/Release
          gpg -abs --yes -u "$GPG_FINGERPRINT" -o dists/nightly/Release.gpg dists/nightly/Release

      - name: Commit cleanup through the GitHub Git Data API
        if: steps.prune.outputs.deleted_count != '0'
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ steps.checkout.outputs.base_sha }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import subprocess
          import tempfile
          from pathlib import Path

          repository = os.environ["GITHUB_REPOSITORY"]
          expected_base = os.environ["BASE_SHA"]
          old_files = json.loads((Path(os.environ["RUNNER_TEMP"]) / "old-nightly-debs.json").read_text())

          def api(path, method="GET", payload=None):
              command = ["gh", "api"]
              if method != "GET":
                  command += ["--method", method]
              command.append(path)
              if payload is None:
                  result = subprocess.run(command, check=True, capture_output=True, text=True)
              else:
                  with tempfile.NamedTemporaryFile("w", encoding="utf-8", suffix=".json") as request:
                      json.dump(payload, request)
                      request.flush()
                      command += ["--input", request.name]
                      result = subprocess.run(command, check=True, capture_output=True, text=True)
              return json.loads(result.stdout)

          ref = api(f"repos/{repository}/git/ref/heads/gh-pages")
          head_sha = ref["object"]["sha"]
          if head_sha != expected_base:
              raise SystemExit(
                  "gh-pages changed during cleanup; refusing to overwrite a newer APT publish. "
                  f"Expected {expected_base}, found {head_sha}."
              )

          head = api(f"repos/{repository}/git/commits/{head_sha}")
          entries = [
              {"path": path, "mode": "100644", "type": "blob", "sha": None}
              for path in old_files
          ]

          metadata_files = [
              "dists/nightly/main/binary-amd64/Packages",
              "dists/nightly/main/binary-amd64/Packages.gz",
              "dists/nightly/Release",
              "dists/nightly/InRelease",
              "dists/nightly/Release.gpg",
          ]
          for filename in metadata_files:
              payload = {
                  "content": base64.b64encode(Path(filename).read_bytes()).decode("ascii"),
                  "encoding": "base64",
              }
              blob = api(f"repos/{repository}/git/blobs", method="POST", payload=payload)
              entries.append({
                  "path": filename,
                  "mode": "100644",
                  "type": "blob",
                  "sha": blob["sha"],
              })

          new_tree = api(
              f"repos/{repository}/git/trees",
              method="POST",
              payload={"base_tree": head["tree"]["sha"], "tree": entries},
          )
          new_commit = api(
              f"repos/{repository}/git/commits",
              method="POST",
              payload={
                  "message": "Prune nightly DEB packages older than 180 days",
                  "tree": new_tree["sha"],
                  "parents": [head_sha],
              },
          )
          api(
              f"repos/{repository}/git/refs/heads/gh-pages",
              method="PATCH",
              payload={"sha": new_commit["sha"], "force": False},
          )
          print(f"Committed cleanup: removed {len(old_files)} old DEB files.")
          print(f"Commit: {new_commit['sha']}")
          PY
